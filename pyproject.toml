[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riot-email-automation"
version = "0.1.0"
description = "Camoufox-driven Riot email-change automation and job queue"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "camoufox[geoip]==0.5.6",
    "PySocks>=1.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
    "email-validator>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["server", "cookie_extractor"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# Russian UI/docs intentionally contain Cyrillic lookalikes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# server.py inserts the project root into sys.path before importing local modules.
"server.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
